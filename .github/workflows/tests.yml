name: Tests and package build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python examples/custom_backbone.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Import installed wheel outside the source tree
        working-directory: /tmp
        run: python -c "import torch, tvae; m=tvae.TVAE(input_dim=4, latent_dim=2); m.loss(torch.rand(2,4)).loss.backward()"
