[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-tvae"
version = "0.2.0"
description = "Student-t latent priors and label-free VAEs with analytic Gaussian-Gamma regularization"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Zhikang Xu"}, {name = "Jiarui Xing"}, {name = "Jian Wang"}]
dependencies = ["torch>=2.1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
examples = ["torchvision>=0.16"]
experiments = ["torchvision>=0.16", "numpy", "scipy", "scikit-learn", "pandas", "matplotlib", "pillow"]
dev = ["build>=1", "twine>=5"]

[project.urls]
Repository = "https://github.com/xuzhikangnba/torch-tvae"
Issues = "https://github.com/xuzhikangnba/torch-tvae/issues"

[project.scripts]
tvae-mnist = "tvae.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tvae = ["py.typed"]
